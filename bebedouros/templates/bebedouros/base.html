<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Monitoramento da Água — IFRN-CNAT{% endblock %}</title>
  <style>
    :root {
      --fundo: #eef4f7;
      --superficie: #ffffff;
      --profunda: #0a4d6b;
      --profunda-2: #0c5f83;
      --media: #1580a9;
      --clara: #dbeef4;
      --tinta: #16323d;
      --tinta-suave: #566e79;
      --borda: #c2d9e2;
      --rascunho-bg: #e6ebee; --rascunho-tt: #47575f;
      --publicado-bg: #cdece0; --publicado-tt: #1c6b4e;
      --aviso-bg: #fbf1d3; --aviso-bd: #e6cf8f;
      --erro-bg: #f7dede; --erro-bd: #e0b4b4;
      --ok-bg: #d6ede2; --ok-bd: #a9d6c0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0; color: var(--tinta); background: var(--fundo);
      line-height: 1.5;
    }
    a { color: var(--media); }
    *:focus-visible { outline: 3px solid var(--media); outline-offset: 2px; border-radius: 2px; }

    .topo { background: var(--profunda); color: #fff; }
    .topo-inner {
      max-width: 1320px; margin: 0 auto; padding: 14px 20px;
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 22px;
    }
    .topo-nome {
      font-size: 15px; font-weight: 650; letter-spacing: -0.01em;
      margin-right: auto;
    }
    .topo nav { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; }
    .topo nav a, .topo .sair-btn {
      color: #cfe6ef; text-decoration: none; font-size: 14px;
      background: none; border: 0; padding: 0; cursor: pointer;
      font-family: inherit;
    }
    .topo nav a:hover, .topo .sair-btn:hover { color: #fff; text-decoration: underline; }
    .onda { display: block; width: 100%; height: 34px; }

    main { max-width: 1320px; margin: 0 auto; padding: 26px 20px 60px; }
    h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 6px; }
    .voltar { display: inline-block; margin: 0 0 18px; font-size: 14px; }

    .msg { padding: 10px 14px; margin: 8px 0; border-radius: 8px; border: 1px solid transparent; font-size: 14px; }
    .msg.warning { background: var(--aviso-bg); border-color: var(--aviso-bd); }
    .msg.error { background: var(--erro-bg); border-color: var(--erro-bd); }
    .msg.success { background: var(--ok-bg); border-color: var(--ok-bd); }

    .painel {
      background: var(--superficie); border: 1px solid var(--borda);
      border-radius: 12px; padding: 4px; overflow-x: auto;
    }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--borda); vertical-align: middle; }
    thead th {
      background: var(--clara); color: var(--profunda);
      font-weight: 600; border-bottom: 2px solid var(--borda);
      position: sticky; top: 0; overflow-wrap: break-word;
    }
    thead th .unid { display: block; font-weight: 400; font-size: 12px; color: var(--tinta-suave); }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #f4f9fb; }
    td.cod { font-weight: 600; color: var(--profunda); white-space: nowrap; }
    tr.bloqueada td { background: #f3f5f6; color: #8a9aa1; }

    td.iqab { font-weight: 600; white-space: nowrap; color: var(--tinta-suave); }
    td.iqab.faixa-excelente { color: #1c6b4e; background: #dbf1e6; }
    td.iqab.faixa-boa { color: #185a86; background: #dcecf6; }
    td.iqab.faixa-regular { color: #8a5a00; background: #faefd5; }
    td.iqab.faixa-ruim { color: #9a4a1a; background: #f7e2d3; }
    td.iqab.faixa-critica { color: #922; background: #f6dcdc; }

    input[type="text"], input[type="number"], input[type="date"], select, input:not([type]) {
      font: inherit; padding: 6px 6px; border: 1px solid var(--borda);
      border-radius: 6px; background: #fff; color: var(--tinta); max-width: 100%;
    }
    table input:not([type="checkbox"]), table select { width: 100%; min-width: 56px; }

    .grade th:nth-child(2), .grade td:nth-child(2) { min-width: 44px; }
    .grade td:nth-child(4) input { min-width: 76px; }
    .grade td:nth-child(8) select, .grade td:nth-child(9) select { min-width: 68px; }
    .grade td:nth-child(10) select { min-width: 84px; }
    .grade td:nth-child(11) { text-align: center; white-space: nowrap; }
    .grade td:nth-child(12) input { min-width: 110px; }

    .acoes { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      font: inherit; font-size: 14px; font-weight: 550;
      padding: 9px 16px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--profunda); background: var(--profunda); color: #fff;
      text-decoration: none; display: inline-block;
    }
    .btn:hover { background: var(--profunda-2); }
    .btn.secundario { background: #fff; color: var(--profunda); }
    .btn.secundario:hover { background: var(--clara); }
    .btn.perigo { border-color: #a83232; background: #a83232; }
    .btn.perigo:hover { background: #8f2a2a; }

    .etiqueta { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .etiqueta.rascunho { background: var(--rascunho-bg); color: var(--rascunho-tt); }
    .etiqueta.publicado { background: var(--publicado-bg); color: var(--publicado-tt); }

    .lista-vazia { color: var(--tinta-suave); }

    /* Alertas (tela Início) */
    .alertas h2 { font-size: 16px; margin: 22px 0 10px; }
    .alerta-bloco {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 10px;
      padding: 10px 0; border-bottom: 1px solid var(--borda);
    }
    .alerta-bloco:last-child { border-bottom: 0; }
    .alerta-titulo { font-weight: 600; min-width: 160px; }
    .alerta-ok { color: var(--tinta-suave); font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
      border: 1px solid transparent;
    }
    .chip-ruim { background: #f7e2d3; color: #9a4a1a; border-color: #eccbab; }
    .chip-critica { background: var(--erro-bg); color: #922; border-color: var(--erro-bd); }
    .chip-vencido { background: var(--aviso-bg); color: #8a5a00; border-color: var(--aviso-bd); }
    .chip { text-decoration: none; }
    td.cod a { color: inherit; text-decoration: none; }

    /* Gota d'água — identidade visual do IQA-B (DESENHO-PARTE-VISUAL.md §3).
       Reaproveitada, nos mesmos nomes de classe, pelo mapa público e pela
       página do bebedouro em planos futuros. */
    .gota {
      display: inline-block; border-radius: 50% 50% 50% 0; transform: rotate(135deg);
    }
    .gota-sm { width: 14px; height: 14px; }
    .gota-vazia { background: #e4ecf0; border: 1px solid var(--borda); }
    .gota-excelente { background: #1c6b4e; }
    .gota-boa { background: #185a86; }
    .gota-regular { background: #c99a2e; }
    .gota-ruim { background: #b9601f; }
    .gota-critica { background: #a32222; }
    .gota-lg { width: 96px; height: 96px; }
    .gota-grande-wrap {
      position: relative; display: inline-block; width: 96px; height: 96px; flex-shrink: 0;
    }
    .gota-grande-wrap .gota-lg { position: absolute; inset: 0; }
    .gota-numero-grande {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 700; color: #fff;
    }

    /* Página do bebedouro */
    .cabecalho-bebedouro {
      display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
      background: var(--clara); border-radius: 14px; padding: 22px 26px;
    }
    .foto-placeholder {
      width: 240px; height: 180px; border-radius: 12px; flex-shrink: 0;
      background: var(--superficie); border: 1px solid var(--borda);
      display: flex; align-items: center; justify-content: center;
      color: var(--profunda-2); opacity: 0.55;
    }
    .cabecalho-info { flex: 1 1 240px; }
    .cabecalho-classificacao { font-size: 24px; font-weight: 700; margin: 4px 0 0; color: var(--tinta); }
    .cabecalho-status { color: var(--tinta-suave); margin: 2px 0 0; }
    .cartoes-indice, .parametros { margin-top: 20px; }
    .cartoes-indice h2, .parametros h2 { font-size: 16px; margin: 0 0 10px; }
    .cartoes-indice-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .cartao-indice {
      background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px;
      padding: 12px 14px; flex: 1 1 180px; min-width: 180px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .cartao-indice:nth-child(2n) { background: var(--clara); }
    .cartao-indice-nome { font-weight: 600; }
    .cartao-indice-peso { font-size: 12px; color: var(--tinta-suave); }
    .cartao-indice-nota { font-size: 22px; font-weight: 700; }
    .cartao-indice-motivo { font-size: 13px; color: #8a5a00; }

    /* Gráfico de evolução */
    .grafico-selecao {
      display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 12px; font-size: 14px;
    }
    .grafico-selecao-grupo { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
    .grafico-selecao-rotulo { color: var(--tinta-suave); }
    .grafico-selecao a { color: var(--tinta-suave); text-decoration: none; }
    .grafico-selecao a:hover { text-decoration: underline; }
    .grafico-selecao a.ativo { color: var(--profunda); font-weight: 700; }
    .grafico-svg { width: 100%; height: auto; }
    .grafico-linha { fill: none; stroke: var(--profunda-2); stroke-width: 2; }
    .grafico-ponto { fill: var(--profunda-2); }
    .grafico-eixo-data { font-size: 11px; fill: var(--tinta-suave); }
    .grafico-faixa.faixa-excelente { fill: #dbf1e6; }
    .grafico-faixa.faixa-boa { fill: #dcecf6; }
    .grafico-faixa.faixa-regular { fill: #faefd5; }
    .grafico-faixa.faixa-ruim { fill: #f7e2d3; }
    .grafico-faixa.faixa-critica { fill: #f6dcdc; }
    .grafico-vazio { color: var(--tinta-suave); }

    /* Quinzenas anteriores */
    .historico-item {
      background: var(--superficie); border: 1px solid var(--borda); border-radius: 8px;
      margin-bottom: 6px; padding: 2px 14px;
    }
    .historico-item summary {
      cursor: pointer; padding: 8px 0; font-weight: 600; color: var(--profunda);
      list-style: none;
    }
    .historico-item summary::-webkit-details-marker { display: none; }
    .historico-item summary::before { content: "▸ "; color: var(--tinta-suave); }
    .historico-item[open] summary::before { content: "▾ "; }
    .historico-detalhe { padding: 0 0 12px; font-size: 14px; }
    .historico-detalhe p { margin: 4px 0; }
    .historico-vazio { color: var(--tinta-suave); }

    /* Mapa do campus */
    .mapa-cabecalho { text-align: center; }
    .mapa-cabecalho h1 { margin-left: auto; margin-right: auto; font-size: 27px; }
    .mapa-descricao {
      color: var(--tinta-suave); font-size: 16px; margin: 8px auto 0;
      max-width: 62ch;
    }
    .mapa-instrucao { color: var(--tinta-suave); font-size: 13px; margin: 8px 0 0; }
    .mapa-wrap {
      position: relative; display: block; width: fit-content; max-width: 100%;
      margin: 14px auto 0; line-height: 0;
    }
    .mapa-imagem {
      display: block; max-width: 100%; height: auto;
      border-radius: 12px; border: 1px solid var(--borda);
    }
    .mapa-credito {
      text-align: center; color: var(--tinta-suave); font-size: 11px; margin: 6px 0 0;
    }
    .mapa-ponto {
      position: absolute; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      text-decoration: none;
    }
    .gota-md {
      width: 22px; height: 22px;
      box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(10, 30, 40, 0.5);
      transition: transform 0.12s ease;
    }
    .mapa-ponto:hover .gota-md { transform: rotate(135deg) scale(1.25); }
    .mapa-ponto-rotulo {
      background: rgba(255, 255, 255, 0.94); color: var(--profunda);
      font-size: 11px; font-weight: 700; line-height: 1;
      padding: 3px 6px; border-radius: 999px; white-space: nowrap;
      box-shadow: 0 1px 3px rgba(10, 30, 40, 0.3);
    }
    @media (max-width: 620px) { main { padding: 18px 14px 48px; } h1 { font-size: 20px; } }
  </style>
</head>
<body>
  <header class="topo">
    <div class="topo-inner">
      <span class="topo-nome">Sistema de Monitoramento e Gestão da Água no IFRN&nbsp;&ndash;&nbsp;CNAT</span>
      <nav>
        {% if user.is_authenticated %}
          <a href="{% url 'inicio' %}">Início</a>
          <a href="{% url 'coleta_list' %}">Coletas</a>
          <a href="/admin/bebedouros/bebedouro/">Bebedouros</a>
          <form action="{% url 'logout' %}" method="post" style="display:inline">
            {% csrf_token %}
            <button type="submit" class="sair-btn">Sair</button>
          </form>
        {% else %}
          <a href="{% url 'mapa' %}">Mapa</a>
          <a href="{% url 'login' %}">Entrar</a>
        {% endif %}
      </nav>
    </div>
    <svg class="onda" viewBox="0 0 1440 34" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 20 C 240 2, 480 2, 720 18 S 1200 34, 1440 16 L1440 34 L0 34 Z" fill="#0c5f83"/>
      <path d="M0 26 C 240 12, 480 12, 720 24 S 1200 38, 1440 24 L1440 34 L0 34 Z" fill="#eef4f7"/>
    </svg>
  </header>
  <main>
    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
