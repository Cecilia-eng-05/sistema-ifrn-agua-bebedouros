{% extends "bebedouros/base.html" %}
{% block conteudo %}
  <h1>Apagar a coleta de {{ coleta.data|date:"d/m/Y" }}?</h1>
  <p>Isso remove os resultados de todos os bebedouros dessa data. Não dá para desfazer.</p>
  <form method="post">
    {% csrf_token %}
    <div class="acoes">
      <button type="submit" class="btn perigo">Apagar</button>
      <a class="btn secundario" href="{% url 'coleta_list' %}">Cancelar</a>
    </div>
  </form>
{% endblock %}
