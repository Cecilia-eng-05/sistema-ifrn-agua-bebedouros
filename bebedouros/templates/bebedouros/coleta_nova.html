{% extends "bebedouros/base.html" %}
{% block conteudo %}
  <h1>Nova coleta</h1>
  <a class="voltar" href="{% url 'coleta_list' %}">&larr; Voltar para a lista</a>
  <form method="post">
    {% csrf_token %}
    <p>
      <label for="id_data" style="display:block;font-weight:600;margin-bottom:4px;">Data da coleta</label>
      {{ form.data }}
    </p>
    {{ form.data.errors }}
    <div class="acoes">
      <button type="submit" class="btn">Criar</button>
    </div>
  </form>
  {% if existente %}
    <p style="margin-top:16px;"><a href="{% url 'lancamento' existente.pk %}">Abrir a coleta existente &rarr;</a></p>
  {% endif %}
{% endblock %}
